[mypy]
python_version = 3.12
strict = True
files = illumio_ops

# flask-login, flask-wtf, flask-talisman and APScheduler 3 ship no type information.
[mypy-flask_login.*,flask_wtf.*,flask_talisman.*,apscheduler.*]
ignore_missing_imports = True

[mypy-illumio_ops.web.*]
disallow_subclassing_any = False
disallow_untyped_decorators = False
