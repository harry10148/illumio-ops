[mypy]
python_version = 3.12
strict = True
files = illumio_ops

# flask-login, flask-wtf and flask-talisman ship no type information.
[mypy-flask_login.*,flask_wtf.*,flask_talisman.*]
ignore_missing_imports = True

[mypy-illumio_ops.web.*]
disallow_subclassing_any = False
disallow_untyped_decorators = False
