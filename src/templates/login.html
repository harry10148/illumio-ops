<!doctype html>
<html lang="{{ html_lang }}" data-theme="dark" data-density="cozy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf-token" content="{{ csrf_token() }}">
<title>illumio-ops · login</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/v2/tokens.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/v2/components.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/v2/app.css') }}">
<!-- Same pre-paint bootstrap as base.html: an anonymous visitor's very
     first paint on this page must not flash the wrong theme either. See
     core/theme-bootstrap.js for why this is an external classic script,
     not the mockup's inline block (this app's CSP has no 'unsafe-inline'
     and injects no nonce). theme.mjs owns every change after this point. -->
<script src="{{ url_for('static', filename='js/v2/core/theme-bootstrap.js') }}"></script>
</head>
<body class="loginpage">
<div id="login-root"></div>
<!-- login.mjs's i18n seed: the real gui_/sched_/status_/error_/pd_
     catalogue in the operator's configured language, rendered server-side
     (src/gui/routes/auth.py's login_page()) because GET /api/ui_translations
     itself 401s for this page's anonymous visitors. Same pattern as the
     legacy login.html's #login-i18n-data it replaced, applied to the full
     catalogue instead of a hand-picked key list. -->
<script id="login-i18n-seed" type="application/json">{{ login_i18n_json | safe }}</script>
<script type="module" src="{{ url_for('static', filename='js/v2/areas/login.mjs') }}"></script>
</body>
</html>
