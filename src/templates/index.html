<!doctype html>
<html lang="{{ html_lang }}" data-theme="light" data-density="cozy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf-token" content="{{ csrf_token() }}">
<title>illumio-ops</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/v2/tokens.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/v2/components.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/v2/app.css') }}">
<!-- Paints the persisted theme/density before first paint (see
     core/theme-bootstrap.js for why this is an external classic script,
     not the mockup's inline block: this app's CSP has no 'unsafe-inline'
     and injects no nonce). theme.mjs owns every change after this point. -->
<script src="{{ url_for('static', filename='js/v2/core/theme-bootstrap.js') }}"></script>
</head>
<body>
<!-- shell.mjs builds the whole <nav class="sidenav"> in here (brand, the
     five areas and the current one's sub-items, the palette entry, the user
     popover); area-root is the only thing the router ever writes into. The
     two are grid columns of .frame — see css/v2/app.css. -->
<div class="frame">
<div id="shell"></div>
<main id="area-root" class="workarea"></main>
</div>
<script type="module" src="{{ url_for('static', filename='js/v2/app.mjs') }}"></script>
</body>
</html>
