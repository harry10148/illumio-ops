<!doctype html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Direction B — Ops Console · Overview</title>
<style>
/* ============================================================
   DIRECTION B — Ops console (dark-first, instrument density)
   Chart + status color come from the dataviz reference palette:
   ordinal blue ramp #184f95→#6da7ec (dark) / #86b6ef→#104281 (light),
   series blue #3987e5, status good/warning/critical #0ca30c/#fab219/#d03b3b.
   Rule applied throughout: marks wear the status hue, text wears ink.
   ============================================================ */
:root{--font-ui:"Noto Sans","Noto Sans CJK TC",sans-serif}
:root{--font-mono:"Noto Sans Mono","DejaVu Sans Mono",monospace}
:root{
  color-scheme:dark;
  --page:#0B0E13;
  --pan:#151A21;
  --pan-2:#1B212A;
  --rail:#0E1218;
  --line:#232A34;
  --line-2:#1D242D;
  --ink:#E6EAF0;
  --ink-2:#9AA4B2;
  --ink-3:#6E7A8A;
  --accent:#3987e5;
  --ok:#0ca30c;
  --warn:#fab219;
  --crit:#d03b3b;
  --info:#3987e5;
  --neutral:#8b929e;
  --ok-fill:#0f2a14;
  --warn-fill:#2e2410;
  --crit-fill:#2c1417;
  --info-fill:#132437;
  --neutral-fill:#1E242D;
  --bar:#3987e5;
  --r1:#184f95;
  --r2:#256abf;
  --r3:#3987e5;
  --r4:#6da7ec;
  --grid:#212832;
  --track:#1E252F;
  --ok-ink:#3ec93e;
  --warn-ink:#fab219;
  --crit-ink:#f07070;
  --info-ink:#6da7ec;
  --neutral-ink:#9AA4B2;
}
:root[data-theme="light"]{
  color-scheme:light;
  --page:#EEF1F5;
  --pan:#FFFFFF;
  --pan-2:#F5F7FA;
  --rail:#12161C;
  --line:#DDE2E9;
  --line-2:#E7EBF0;
  --ink:#12161C;
  --ink-2:#414B59;
  --ink-3:#6E7A8A;
  --accent:#2a78d6;
  --ok-fill:#E4F3E4;
  --warn-fill:#FBF0D8;
  --crit-fill:#FAE6E6;
  --info-fill:#E3EEFB;
  --neutral-fill:#EDF0F4;
  --bar:#2a78d6;
  --r1:#86b6ef;
  --r2:#5598e7;
  --r3:#256abf;
  --r4:#104281;
  --grid:#E7EBF0;
  --track:#E9EDF2;
  --ok-ink:#0a7d0a;
  --warn-ink:#8a5d00;
  --crit-ink:#c22f2f;
  --info-ink:#1c5cab;
  --neutral-ink:#5c6472;
}
@media (prefers-color-scheme:light){
  :root:where(:not([data-theme="dark"])){
    color-scheme:light;
    --page:#EEF1F5;
    --pan:#FFFFFF;
    --pan-2:#F5F7FA;
    --rail:#12161C;
    --line:#DDE2E9;
    --line-2:#E7EBF0;
    --ink:#12161C;
    --ink-2:#414B59;
    --ink-3:#6E7A8A;
    --accent:#2a78d6;
    --ok-fill:#E4F3E4;
    --warn-fill:#FBF0D8;
    --crit-fill:#FAE6E6;
    --info-fill:#E3EEFB;
    --neutral-fill:#EDF0F4;
    --bar:#2a78d6;
    --r1:#86b6ef;
    --r2:#5598e7;
    --r3:#256abf;
    --r4:#104281;
    --grid:#E7EBF0;
    --track:#E9EDF2;
    --ok-ink:#0a7d0a;
    --warn-ink:#8a5d00;
    --crit-ink:#c22f2f;
    --info-ink:#1c5cab;
    --neutral-ink:#5c6472;
  }
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;padding:0}
body{background:var(--page);color:var(--ink);font-family:var(--font-ui);font-size:13px;line-height:1.35}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ---------- top bar ---------- */
.top{background:var(--rail);border-bottom:1px solid #000000}
.top-in{display:flex;align-items:center;gap:28px;height:46px;padding:0 20px}
.logo{display:flex;align-items:center;gap:8px;color:#fff;text-decoration:none}
.logo b{font-size:15px;font-weight:700;letter-spacing:-.01em}
.logo s{width:5px;height:5px;background:#FF5500;border-radius:1px;text-decoration:none}
.logo span{font-family:var(--font-mono);font-size:10px;color:#7B8798;letter-spacing:.1em}
.tabs{display:flex;gap:2px;flex:1}
.tabs a{position:relative;text-decoration:none;color:#8C97A8;font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:15px 12px;display:flex;gap:7px;align-items:baseline}
.tabs a u{text-decoration:none;font-size:12px;letter-spacing:0;font-weight:400}
.tabs a:hover{color:#D6DDE6;background:rgba(255,255,255,.04)}
.tabs a[aria-current]{color:#fff;background:rgba(57,135,229,.14)}
.tabs a[aria-current]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--accent)}
.tr{display:flex;align-items:center;gap:12px;color:#8C97A8;font-size:11px}
.tr .bt{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:#C8D2DE;font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;padding:5px 9px;border-radius:3px;cursor:pointer;text-transform:uppercase}
.tr .bt:hover{border-color:var(--accent);color:#fff}
.uchip{display:flex;align-items:center;gap:8px;padding-left:12px;border-left:1px solid rgba(255,255,255,.12)}
.uchip u{width:24px;height:24px;border-radius:3px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:9px;font-weight:700;text-decoration:none}
.uchip b{display:block;color:#E6EAF0;font-size:11px;font-weight:600}
.uchip small{display:block;color:#7B8798;font-size:10px;font-family:var(--font-mono)}

/* ---------- instrument rail ---------- */
.rail{display:grid;grid-template-columns:repeat(5,1fr) auto;background:var(--rail);border-bottom:1px solid var(--line);padding:0 20px}
.cell{padding:10px 16px 0;border-left:1px solid rgba(255,255,255,.06);min-width:0}
.cell:first-child{border-left:0;padding-left:0}
.cell .k{display:flex;align-items:center;gap:7px;font-size:9.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#7B8798}
.led{width:8px;height:8px;border-radius:1px;background:var(--dotc);box-shadow:0 0 0 2px var(--dotring);flex:none}
.cell .v{font-family:var(--font-mono);font-size:19px;color:#EDF1F6;margin:7px 0 4px;letter-spacing:-.02em}
.cell .d{font-size:10.5px;color:#6E7A8A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-bottom:8px}
.cell .ul{height:2px;background:var(--dotc);opacity:.85}
.railmeta{display:flex;align-items:center;gap:18px;padding:0 0 0 20px;border-left:1px solid rgba(255,255,255,.06);color:#7B8798;font-size:10.5px}
.t-ok{--dotc:var(--ok);--dotring:var(--ok-fill);--txtc:var(--ok-ink)}
.t-warn{--dotc:var(--warn);--dotring:var(--warn-fill);--txtc:var(--warn-ink)}
.t-crit{--dotc:var(--crit);--dotring:var(--crit-fill);--txtc:var(--crit-ink)}
.t-info{--dotc:var(--info);--dotring:var(--info-fill);--txtc:var(--info-ink)}
.t-neutral{--dotc:var(--neutral);--dotring:var(--neutral-fill);--txtc:var(--neutral-ink)}

/* ---------- panel grid ---------- */
.board{padding:14px 20px 34px;display:flex;flex-direction:column;gap:12px}
.row{display:grid;gap:12px}
.g6{grid-template-columns:repeat(6,1fr)}
.g75{grid-template-columns:7fr 5fr}
.g354{grid-template-columns:3fr 5fr 4fr}
.g543{grid-template-columns:5fr 4fr 3fr}
.pan{background:var(--pan);border:1px solid var(--line);border-radius:3px;min-width:0;display:flex;flex-direction:column}
.ph{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line-2);min-height:32px}
.ph h3{margin:0;font-size:9.5px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .m{margin-left:auto;font-family:var(--font-mono);font-size:10px;color:var(--ink-3);white-space:nowrap}
.pb{padding:12px;flex:1;display:flex;flex-direction:column;min-width:0}
.pb.tight{padding:0}
.big{font-family:var(--font-mono);font-size:30px;line-height:1;letter-spacing:-.03em;color:var(--ink)}
.bigrow{display:flex;align-items:baseline;gap:7px;margin-bottom:10px}
.bigrow s{text-decoration:none;font-family:var(--font-mono);font-size:14px;color:var(--ink-3)}
.bigrow em{font-style:normal;margin-left:auto;font-size:9.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--txtc);background:var(--dotring);padding:3px 7px;border-radius:2px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:4px 0;font-size:11.5px;color:var(--ink-2);border-top:1px solid var(--line-2)}
.kv:first-of-type{border-top:0}
.kv b{font-family:var(--font-mono);color:var(--ink);font-weight:400;font-variant-numeric:tabular-nums}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;border-radius:2px;color:var(--txtc);background:var(--dotring)}
.mini{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.mini span{font-family:var(--font-mono);font-size:10px;color:var(--ink-2);background:var(--pan-2);border:1px solid var(--line-2);padding:2px 6px;border-radius:2px}
.mini span.dim{color:var(--ink-3);opacity:.65}
.lg{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:9px;font-size:10.5px;color:var(--ink-2)}
.lg span{display:flex;align-items:center;gap:6px}
.lg i{width:9px;height:9px;border-radius:2px;display:inline-block}
.lg b{font-family:var(--font-mono);color:var(--ink);font-weight:400}
.sw1{background:var(--r1)}
.sw2{background:var(--r2)}
.sw3{background:var(--r3)}
.sw4{background:var(--r4)}

/* ---------- dense tables ---------- */
table.dt{width:100%;border-collapse:collapse;font-size:11.5px}
table.dt th{position:sticky;top:0;text-align:left;font-size:9px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);padding:6px 10px;background:var(--pan-2);border-bottom:1px solid var(--line-2)}
table.dt td{padding:4.5px 10px;border-bottom:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:0}
table.dt td.n{font-family:var(--font-mono);text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
table.dt td.id{font-family:var(--font-mono);color:var(--ink)}
table.dt tr:last-child td{border-bottom:0}
table.dt tr:hover td{background:var(--pan-2)}
.dot-in{width:7px;height:7px;border-radius:1px;background:var(--dotc);display:inline-block;margin-right:7px;vertical-align:1px}

/* ---------- posture ---------- */
.gauge{display:flex;align-items:center;gap:16px;margin-bottom:12px}
.gauge .num{font-family:var(--font-mono);font-size:46px;line-height:1;letter-spacing:-.04em;color:var(--ink)}
.gauge .num s{text-decoration:none;font-size:15px;color:var(--ink-3)}
.gauge .side{flex:1}
.segbar{display:flex;gap:2px}
.segbar i{flex:1;height:16px;background:var(--track);border-radius:1px}
.segbar i.on{background:var(--dotc)}
.gauge .side p{margin:7px 0 0;font-family:var(--font-mono);font-size:10px;color:var(--ink-3)}
.comp{display:grid;grid-template-columns:1fr 58px 44px;gap:6px 8px;align-items:center;padding:6px 0;border-top:1px solid var(--line-2);font-size:11.5px}
.comp .cn{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.comp .cb{grid-column:1/4;height:3px;background:var(--track);border-radius:2px;overflow:hidden}
.comp .cb i{display:block;height:100%;background:var(--r3)}
.comp b{font-family:var(--font-mono);font-weight:400;text-align:right;color:var(--ink)}
.comp em{font-style:normal;font-family:var(--font-mono);font-size:10px;text-align:right;color:var(--ink-3)}
.rmd{margin-top:11px;border-top:1px solid var(--line-2);padding-top:9px}
.rmd h4{margin:0 0 7px;font-size:9px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3)}
.rmd ul{margin:0;padding:0;list-style:none}
.rmd li{display:flex;gap:9px;padding:4px 0;font-size:11px;color:var(--ink-2);line-height:1.4}
.rmd li b{font-family:var(--font-mono);color:var(--accent);font-weight:400;white-space:nowrap}

/* ---------- audit ---------- */
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line-2);border:1px solid var(--line-2);border-radius:2px}
.kpi div{background:var(--pan);padding:6px 8px}
.kpi dt{font-size:9.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.kpi dd{margin:0;font-family:var(--font-mono);font-size:15px;color:var(--ink)}
.att{list-style:none;margin:10px 0 0;padding:0}
.att li{display:grid;grid-template-columns:auto 1fr auto;gap:3px 8px;padding:6px 0;border-top:1px solid var(--line-2);font-size:11.5px}
.att li .s{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att li .r{grid-column:2/4;color:var(--ink-3);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att li .c{font-family:var(--font-mono);color:var(--ink-2)}
.empty{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:9px;border:1px dashed var(--line);border-radius:2px;padding:18px 14px;background:var(--pan-2)}
.empty p{margin:0;font-size:11.5px;color:var(--ink-2);line-height:1.5;max-width:28ch}
.empty .et{font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.empty button{font-family:var(--font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:transparent;border:1px solid var(--accent);padding:5px 10px;border-radius:2px;cursor:pointer}
.errbox{max-width:720px;margin:56px auto;background:var(--crit-fill);border:1px solid var(--crit);border-left-width:3px;border-radius:3px;padding:18px 20px;color:var(--crit)}
.errbox h2{margin:0 0 8px;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.errbox pre{margin:0;white-space:pre-wrap;font-family:var(--font-mono);font-size:11px;color:var(--ink-2)}
svg text{font-family:var(--font-mono)}
.c-ink{fill:var(--ink)}
.c-ink2{fill:var(--ink-2)}
.c-ink3{fill:var(--ink-3)}
.c-bar{fill:var(--bar)}
.c-grid{stroke:var(--grid)}
.c-r1{fill:var(--r1)}
.c-r2{fill:var(--r2)}
.c-r3{fill:var(--r3)}
.c-r4{fill:var(--r4)}
.c-lab-lo{fill:var(--pan)}
.c-lab-hi{fill:var(--ink)}
</style>
</head>
<body>
<div id="app" hidden>
  <header class="top">
    <div class="top-in">
      <a class="logo" href="#"><b>illumio</b><s></s><span>OPS</span></a>
      <nav class="tabs">
        <a href="#" aria-current="page">Overview<u>總覽</u></a>
        <a href="#">Investigate<u>調查</u></a>
        <a href="#">Alerting<u>告警</u></a>
        <a href="#">Automation<u>自動化</u></a>
        <a href="#">Reports<u>報表</u></a>
        <a href="#">System<u>系統</u></a>
      </nav>
      <div class="tr">
        <button class="bt" id="themeBtn" type="button">theme</button>
        <div class="uchip"><u>OPS</u><div><b id="whoHost"></b><small id="whoMeta"></small></div></div>
      </div>
    </div>
  </header>

  <div class="rail" id="rail"></div>

  <main class="board">
    <div class="row g6">
      <section class="pan" id="pVen"></section>
      <section class="pan" id="pEnf"></section>
      <section class="pan" id="pBlk"></section>
      <section class="pan" id="pTls"></section>
      <section class="pan" id="pPipe"></section>
      <section class="pan" id="pAl"></section>
    </div>
    <div class="row g75">
      <section class="pan" id="pTop"></section>
      <section class="pan" id="pPos"></section>
    </div>
    <div class="row g354">
      <section class="pan" id="pJobs"></section>
      <section class="pan" id="pAudit"></section>
      <section class="pan" id="pEvents"></section>
    </div>
    <div class="row g543">
      <section class="pan" id="pRep"></section>
      <section class="pan" id="pDisp"></section>
      <section class="pan" id="pPu"></section>
    </div>
  </main>
</div>

<div id="err" class="errbox" hidden><h2>Overview load failed</h2><pre id="errMsg"></pre></div>

<script>
/* ---------- snapshot plumbing (no hand-written data) ---------- */
const SNAP = "../snapshots/";
const FILES = ["status.json","dashboard_overview.json","dashboard_audit.json","dashboard_pu.json","top10.json","reports_list.json","ui_translations.json"];
const NF = new Intl.NumberFormat("en-US");
let TR = null;

async function grab(name){
  const res = await fetch(SNAP + name);
  if (!res.ok) throw new Error(name + " → HTTP " + res.status);
  return res.json();
}
function t(key, fb){
  const v = TR && TR[key];
  if (typeof v === "string" && v.length) return v;
  return fb === undefined ? key : fb;
}
function fill(str, vals){
  let i = 0;
  return String(str).replace(/\{[a-z_]+\}/g, function(){ return vals[i++]; });
}
function esc(s){
  return String(s === null || s === undefined ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function num(v){ return NF.format(Number(v) || 0); }
function firstLine(s){
  const one = String(s || "").split("\n")[0].trim();
  return one.length > 70 ? one.slice(0,70) + "…" : one;
}
function stamp(iso){
  return String(iso || "").replace("T"," ").replace(/\.\d+/,"").replace("Z","").replace(/\+00:00$/,"").trim();
}
function dur(sec){
  const s = Math.max(0, Math.round(Number(sec) || 0));
  if (s < 90) return s + "s";
  if (s < 5400) return Math.round(s/60) + "m";
  if (s < 172800) return Math.round(s/3600) + "h";
  return Math.round(s/86400) + "d";
}
function since(iso, refIso){
  const a = Date.parse(iso), b = Date.parse(refIso);
  if (!isFinite(a) || !isFinite(b)) return "—";
  return dur((b - a) / 1000);
}
function tone(level){
  const s = String(level || "").toLowerCase();
  if (s === "ok" || s === "success" || s === "online" || s === "pass") return "ok";
  if (s === "warn" || s === "warning" || s === "degraded" || s === "medium") return "warn";
  if (s === "crit" || s === "critical" || s === "error" || s === "fail" || s === "failed" || s === "offline" || s === "high") return "crit";
  if (s === "info" || s === "low") return "info";
  return "neutral";
}
function toneWord(tn){
  if (tn === "ok") return t("gui_status_pill_label_success");
  if (tn === "warn") return t("gui_status_pill_label_warning");
  if (tn === "crit") return t("gui_status_pill_label_danger");
  if (tn === "info") return t("gui_status_pill_label_info");
  return t("gui_status_pill_label_neutral");
}
function worst(levels){
  const rank = ["ok","info","neutral","warn","crit"];
  let out = "ok";
  levels.forEach(function(l){ const tn = tone(l); if (rank.indexOf(tn) > rank.indexOf(out)) out = tn; });
  return out;
}
const CHART_FONT = '"Noto Sans Mono", "DejaVu Sans Mono", monospace';
let _ctx = null;
function textw(str, px){
  if (!_ctx) _ctx = document.createElement("canvas").getContext("2d");
  _ctx.font = px + "px " + CHART_FONT;
  return _ctx.measureText(String(str)).width;
}
function clipText(str, maxw, px){
  let s = String(str);
  if (textw(s, px) <= maxw) return s;
  while (s.length > 1 && textw(s + "…", px) > maxw) s = s.slice(0, -1);
  return s + "…";
}

/* ---------- SVG primitives ---------- */
function capPath(x, y, w, h, r){
  const rr = Math.max(0, Math.min(r, w, h/2));
  return "M" + x + "," + y + " H" + (x + w - rr) +
    " A" + rr + "," + rr + " 0 0 1 " + (x + w) + "," + (y + rr) +
    " V" + (y + h - rr) +
    " A" + rr + "," + rr + " 0 0 1 " + (x + w - rr) + "," + (y + h) +
    " H" + x + " Z";
}
/* Ranked bars — one series, one hue, value at the tip, no second axis. */
function rankedBars(host, rows, labelW, valueW, rowH, lead, sub){
  if (!host) return;
  const W = Math.max(300, host.clientWidth), pad = 12;
  const H = rows.length * rowH + 4;
  const x0 = labelW, span = Math.max(30, W - valueW - labelW);
  const max = rows.reduce(function(m, r){ return Math.max(m, r[2]); }, 0) || 1;
  let s = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="img">';
  rows.forEach(function(r, i){
    const y = 4 + i * rowH;
    const bw = Math.max(2, Math.round(span * (r[2] / max)));
    const barY = sub ? y + 8 : y + Math.round((rowH - 9) / 2) - 3;
    s += '<line class="c-grid" x1="0" y1="' + (y + rowH - 2) + '" x2="' + W + '" y2="' + (y + rowH - 2) + '" stroke-width="1"/>';
    s += '<text class="c-ink" x="0" y="' + (y + lead) + '" font-size="11">' + esc(clipText(r[0], labelW - pad, 11)) + '</text>';
    if (sub) s += '<text class="c-ink3" x="0" y="' + (y + lead + 12) + '" font-size="9.5">' + esc(clipText(r[1], labelW - pad, 9.5)) + '</text>';
    s += '<path class="c-bar" d="' + capPath(x0, barY, bw, 9, 3) + '"/>';
    s += '<text class="c-ink2" x="' + (x0 + bw + 8) + '" y="' + (barY + 8) + '" font-size="10.5">' + esc(r[3]) + '</text>';
  });
  s += "</svg>";
  host.innerHTML = s;
}
/* Ordinal composition — one hue, ordered steps, 2px surface gaps. */
function ordinalStack(host, segs){
  if (!host) return;
  const W = Math.max(120, host.clientWidth), H = 22, gap = 2;
  const total = segs.reduce(function(a, s){ return a + s[1]; }, 0) || 1;
  const live = segs.filter(function(s){ return s[1] > 0; });
  const usable = W - gap * Math.max(0, live.length - 1);
  let x = 0, s = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="img">';
  segs.forEach(function(seg, i){
    if (seg[1] <= 0) return;
    const w = Math.max(5, Math.round(usable * (seg[1] / total)));
    s += '<rect class="c-r' + (i + 1) + '" x="' + x + '" y="0" width="' + w + '" height="' + H + '" rx="1"/>';
    const lab = String(seg[1]);
    if (w > textw(lab, 10) + 14){
      s += '<text class="' + (i >= 2 ? "c-lab-lo" : "c-lab-hi") + '" x="' + (x + 6) + '" y="' + (H/2 + 3.5) + '" font-size="10">' + lab + '</text>';
    }
    x += w + gap;
  });
  s += "</svg>";
  host.innerHTML = s;
}

/* ---------- render ---------- */
function paint(st, ov, au, pu, top, rl){
  const ref = ov.as_of;
  const ven = ov.ven || {}, enf = ov.enforcement || {}, blk = ov.blocked || {}, pipe = ov.pipeline || {}, tls = ov.tls || {}, po = ov.posture || {}, al = ov.alerts || {};
  const jobs = ov.job_health || [];
  const chans = st.alert_channels || [];
  const pce = st.pce_stats || {};
  const su = au.summary || {};

  document.getElementById("whoHost").textContent = String(st.api_url || "").replace(/^https?:\/\//, "");
  document.getElementById("whoMeta").textContent = "v" + st.version + " " + st.timezone;

  /* --- instrument rail: 5 semantic lights --- */
  const badJobs = jobs.filter(function(j){ return j.level !== "ok"; });
  const lags = pipe.cache_lag || [];
  const maxLag = lags.reduce(function(m, l){ return Math.max(m, l.lag_s || 0); }, 0);
  const liveCh = chans.filter(function(c){ return c.enabled && c.configured; });
  const failCh = liveCh.filter(function(c){ return c.last_status && c.last_status !== "success"; });
  const lights = [];
  lights.push([t("gui_ov_job_health"), badJobs.length ? worst(badJobs.map(function(j){ return j.level; })) : "ok",
    (jobs.length - badJobs.length) + "/" + jobs.length,
    t("gui_jh_overdue") + " " + badJobs.length + " · " + t("gui_jh_th_last_run") + " " + since(jobs.length ? jobs[0].last_run : ref, ref)]);
  lights.push([t("gui_dashboard_pce_health"),
    pce.consecutive_failures > 0 ? "crit" : (pce.last_error ? "warn" : tone(pce.health_status)),
    String(pce.health_status || "").toUpperCase(),
    pce.last_error ? (pce.last_error_stage + " · " + firstLine(pce.last_error)) : ("last_success " + since(pce.last_success, ref))]);
  lights.push([t("gui_ov_cache_lag_label"), worst(lags.map(function(l){ return l.level; })), dur(maxLag),
    lags.map(function(l){ return l.source + " " + dur(l.lag_s); }).join(" · ")]);
  lights.push([t("gui_ov_pipeline_title"), tone(pipe.verdict), pipe.siem_success_1h + "%",
    t("gui_ov_dlq") + " " + num(pipe.dlq) + " · queue " + (pipe.siem_idle ? "idle" : "active")]);
  lights.push([t("gui_ov_alert_channels"), failCh.length ? "crit" : (liveCh.length ? "info" : "neutral"),
    liveCh.length + "/" + chans.length,
    liveCh.map(function(c){ return c.name; }).join(" · ") + " " + t("gui_ov_ch_configured")]);

  document.getElementById("rail").innerHTML = lights.map(function(l){
    return '<div class="cell t-' + l[1] + '"><div class="k"><span class="led"></span>' + esc(l[0]) + '</div>' +
      '<div class="v">' + esc(l[2]) + '</div><div class="d" title="' + esc(l[3]) + '">' + esc(l[3]) + '</div><div class="ul"></div></div>';
  }).join("") +
  '<div class="railmeta"><span>' + esc(t("gui_ov_as_of")) + ' <b class="mono">' + esc(stamp(ref)) + '</b></span>' +
  '<span class="mono">' + esc(st.timezone) + '</span><span>' + esc(t("gui_ov_autorefresh")) + '</span></div>';

  function head(id, title, meta){
    return '<div class="ph"><h3>' + esc(title) + '</h3><span class="m">' + meta + '</span></div>';
  }

  /* --- 6 compact stat panels --- */
  const venT = tone(ven.verdict);
  document.getElementById("pVen").innerHTML =
    head(0, t("gui_ov_ven_title"), esc(t("gui_ov_online"))) +
    '<div class="pb"><div class="bigrow t-' + venT + '"><span class="big">' + ven.online + '</span><s>/' + ven.total + '</s><em>' + esc(toneWord(venT)) + '</em></div>' +
    '<div class="kv"><span>' + esc(t("gui_ov_offline")) + '</span><b>' + ven.offline + '</b></div>' +
    '<div class="kv"><span>degraded</span><b>' + ven.degraded + '</b></div>' +
    '<div class="kv"><span>' + esc(t("gui_ov_oldest_hb")) + '</span><b>' + dur(ven.oldest_heartbeat_age_s) + '</b></div></div>';

  const modes = enf.by_mode || {};
  const order = ["idle","visibility_only","selective","full"];
  const segs = order.map(function(k){ return [k, Number(modes[k]) || 0]; });
  document.getElementById("pEnf").innerHTML =
    head(0, t("gui_ov_enforcement_modes"), esc(t("gui_ov_total")) + " " + enf.total) +
    '<div class="pb"><div id="enfChart"></div><div class="lg">' + segs.map(function(s, i){
      return '<span><i class="sw' + (i + 1) + '"></i>' + esc(s[0]) + ' <b>' + s[1] + '</b></span>';
    }).join("") + '</div></div>';

  const blkT = tone(blk.verdict);
  document.getElementById("pBlk").innerHTML =
    head(0, t("gui_ov_blocked_title"), blk.window_days + "d") +
    '<div class="pb"><div class="bigrow t-' + blkT + '"><span class="big">' + num(blk.blocked) + '</span><s>' + esc(t("gui_pd_blocked")) + '</s></div>' +
    '<div class="kv"><span>' + esc(t("gui_pd_potential")) + '</span><b>' + num(blk.potential) + '</b></div>' +
    '<div class="kv"><span>' + esc(t("gui_pd_allowed")) + '</span><b>' + num(blk.allowed) + '</b></div>' +
    '<div class="kv"><span>' + esc(t("gui_ov_vs_prev")) + '</span><b>' + blk.vs_prev_pct + '%</b></div></div>';

  const tlsT = tls.check_failed ? "crit" : (tls.expiring_soon ? "warn" : "ok");
  document.getElementById("pTls").innerHTML =
    head(0, t("gui_ov_tls_cert"), "https") +
    '<div class="pb"><div class="bigrow t-' + tlsT + '"><span class="big">' + num(tls.days_remaining) + '</span><s>' + esc(t("gui_ov_tls_days")) + '</s><em>' + esc(toneWord(tlsT)) + '</em></div>' +
    '<div class="kv"><span>enabled</span><b>' + (tls.enabled ? "true" : "false") + '</b></div>' +
    '<div class="kv"><span>expiring_soon</span><b>' + (tls.expiring_soon ? "true" : "false") + '</b></div>' +
    '<div class="kv"><span>' + esc(t("gui_health_check")) + '</span><b>' + (st.health_check ? t("gui_status_ok") : t("gui_status_fail")) + '</b></div></div>';

  const pipeT = tone(pipe.verdict);
  document.getElementById("pPipe").innerHTML =
    head(0, t("gui_ov_pipeline_title"), esc(t("gui_ov_siem_1h"))) +
    '<div class="pb"><div class="bigrow t-' + pipeT + '"><span class="big">' + pipe.siem_success_1h + '</span><s>%</s><em>' + esc(toneWord(pipeT)) + '</em></div>' +
    '<div class="kv"><span>' + esc(t("gui_ov_dlq_total")) + '</span><b>' + num(pipe.dlq) + '</b></div>' +
    lags.map(function(l){
      return '<div class="kv"><span>lag · ' + esc(l.source) + '</span><b>' + dur(l.lag_s) + '</b></div>';
    }).join("") + '</div>';

  const alT = tone(al.verdict);
  document.getElementById("pAl").innerHTML =
    head(0, t("gui_ov_alerts_title"), esc(t("gui_ov_fired_24h"))) +
    '<div class="pb"><div class="bigrow t-' + alT + '"><span class="big">' + num(al.fired_24h) + '</span><s>24h</s><em>' + esc(toneWord(alT)) + '</em></div>' +
    '<div class="kv"><span>' + esc(t("gui_ov_failed")) + '</span><b>' + num(al.failed) + '</b></div>' +
    '<div class="kv"><span>' + esc(t("gui_ov_suppressed")) + '</span><b>' + num(al.suppressed) + '</b></div>' +
    '<div class="mini">' + chans.map(function(c){
      return '<span class="' + (c.configured && c.enabled ? "" : "dim") + '">' + esc(c.name) + '</span>';
    }).join("") + '</div></div>';

  /* --- Top 10 traffic --- */
  const rows = (top.data || []).map(function(r){
    return [r.s_name + " " + r.dir + " " + r.d_name, r.svc + "  " + r.s_ip + " → " + r.d_ip, parseFloat(r.val_fmt) || 0, r.val_fmt];
  });
  const trunc = top.truncated ? fill(t("gui_ov_truncated_fmt"), [t("gui_ov_drill_traffic"), top.data.length, top.total]) : (num(top.total) + " " + t("gui_ov_rows"));
  document.getElementById("pTop").innerHTML =
    head(0, "Top 10 · " + t("gui_ov_traffic"), esc(top.source) + " · cap " + top.cap + " · " + esc(trunc)) +
    '<div class="pb"><div id="topChart"></div></div>';

  /* --- Posture --- */
  const score = Number(po.score) || 0;
  const pT = score >= 75 ? "ok" : (score >= 50 ? "warn" : "crit");
  const comps = po.components || [];
  const lit = Math.round(score / 5);
  let segsHtml = "";
  for (let i = 0; i < 20; i++) segsHtml += '<i class="' + (i < lit ? "on" : "") + '"></i>';
  document.getElementById("pPos").innerHTML =
    head(0, t("gui_ov_posture_score_label"), esc(stamp(po.source_date))) +
    '<div class="pb"><div class="gauge t-' + pT + '"><span class="num">' + score + '<s>/100</s></span>' +
    '<span class="side"><span class="segbar">' + segsHtml + '</span><p>' + esc(po.formula) + '</p></span></div>' +
    comps.map(function(c){
      const pct = Math.max(0, Math.min(100, Number(c.value) || 0));
      return '<div class="comp"><span class="cn">' + esc(t(c.label_key)) + '</span><b>' + c.value + c.unit + '</b><em>w' + c.weight + '</em>' +
        '<span class="cb"><i style="width:' + pct + '%"></i></span></div>';
    }).join("") +
    '<div class="rmd"><h4>' + esc(t("gui_posture_rmd_title")) + ' · ' + esc(t("gui_posture_rmd_points")) + '</h4><ul>' +
    (po.remediation || []).slice(0, 3).map(function(r){
      return '<li><b>+' + r.recoverable_points + '</b><span>' + esc(t(r.recommendation_key)) + '</span></li>';
    }).join("") + '</ul></div></div>';

  /* --- Job health (full table) --- */
  document.getElementById("pJobs").innerHTML =
    head(0, t("gui_ov_job_health"), (jobs.length - badJobs.length) + "/" + jobs.length) +
    '<div class="pb tight"><table class="dt"><thead><tr><th>' + esc(t("gui_jh_th_job")) + '</th><th style="text-align:right;width:54px">' + esc(t("gui_jh_th_interval")) +
    '</th><th style="text-align:right;width:54px">' + esc(t("gui_jh_th_last_run")) + '</th></tr></thead><tbody>' +
    jobs.map(function(j){
      return '<tr class="t-' + tone(j.level) + '"><td class="id"><span class="dot-in"></span>' + esc(j.job_id) + '</td>' +
        '<td class="n">' + dur(j.interval_seconds) + '</td><td class="n">' + since(j.last_run, ref) + '</td></tr>';
    }).join("") + '</tbody></table></div>';

  /* --- Audit --- */
  document.getElementById("pAudit").innerHTML =
    head(0, t("gui_dashboard_audit_summary"), esc((su.date_range || []).join(" → ")) + " · " + num(su.record_count)) +
    '<div class="pb"><dl class="kpi">' + (su.kpis || []).map(function(k){
      return '<div><dt title="' + esc(k.label) + '">' + esc(k.label) + '</dt><dd>' + esc(k.value) + '</dd></div>';
    }).join("") + '</dl><ul class="att">' +
    (su.attention_items || []).map(function(a){
      const tn = tone(a.risk);
      return '<li class="t-' + tn + '"><span class="badge">' + esc(a.risk) + '</span><span class="s" title="' + esc(a.summary) + '">' + esc(a.summary) + '</span>' +
        '<span class="c">×' + a.count + '</span><span class="r" title="' + esc(a.recommendation) + '">' + esc(a.event_type) + ' — ' + esc(a.recommendation) + '</span></li>';
    }).join("") + '</ul></div>';

  /* --- Top event types --- */
  const evRows = (su.top_events || []).slice(0, 8).map(function(e){
    return [e["Event Type"], "", Number(e.Count) || 0, num(e.Count)];
  });
  document.getElementById("pEvents").innerHTML =
    head(0, t("gui_dashboard_audit_top_events"), esc(t("gui_ov_events")) + " " + num(su.record_count)) +
    '<div class="pb"><div id="evChart"></div></div>';

  /* --- Reports --- */
  const reps = (rl.reports || []).slice().sort(function(a, b){ return b.mtime - a.mtime; });
  const kinds = [];
  reps.forEach(function(r){
    const k = r.report_type || "—";
    let hit = null;
    kinds.forEach(function(x){ if (x[0] === k) hit = x; });
    if (hit) hit[1] += 1; else kinds.push([k, 1]);
  });
  document.getElementById("pRep").innerHTML =
    head(0, t("gui_tab_reports"), reps.length + " " + esc(t("gui_ov_rows"))) +
    '<div class="pb tight"><table class="dt"><thead><tr><th style="width:118px">type</th><th>file</th><th style="text-align:right;width:52px">size</th></tr></thead><tbody>' +
    reps.slice(0, 6).map(function(r){
      return '<tr><td class="id">' + esc(r.report_type || "—") + '</td><td title="' + esc(r.filename) + '">' + esc(r.filename) + '</td>' +
        '<td class="n">' + Math.round(r.size / 1024) + 'K</td></tr>';
    }).join("") + '</tbody></table></div>' +
    '<div class="pb" style="padding-top:9px"><div class="mini">' + kinds.slice(0, 5).map(function(k){
      return '<span>' + esc(k[0] || "—") + ' ' + k[1] + '</span>';
    }).join("") + '</div></div>';

  /* --- Recent dispatch --- */
  const recent = al.recent || [];
  document.getElementById("pDisp").innerHTML =
    head(0, t("gui_ov_recent_events"), recent.length + " " + esc(t("gui_ov_rows"))) +
    '<div class="pb tight"><table class="dt"><thead><tr><th style="width:62px">ch</th><th>subject</th><th style="text-align:right;width:46px">age</th></tr></thead><tbody>' +
    (recent.length ? recent.map(function(r){
      return '<tr class="t-' + tone(r.status) + '"><td class="id"><span class="dot-in"></span>' + esc(r.channel) + '</td>' +
        '<td title="' + esc(r.subject) + '">' + esc(r.subject) + '</td><td class="n">' + since(r.timestamp, ref) + '</td></tr>';
    }).join("") : '<tr><td colspan="3">' + esc(t("gui_ov_no_events")) + '</td></tr>') + '</tbody></table></div>';

  /* --- Policy usage (真實空狀態) --- */
  document.getElementById("pPu").innerHTML =
    head(0, t("gui_dashboard_policy_usage_summary"), '<span class="badge t-neutral">' + esc(toneWord("neutral")) + '</span>') +
    '<div class="pb"><div class="empty"><span class="et">' + esc(t("gui_reports_empty_title")) + '</span>' +
    '<p>' + esc(pu.error || t("gui_dashboard_no_policy_usage_summary")) + '</p>' +
    '<button type="button">' + esc(t("gui_ov_posture_run_now")) + '</button></div></div>';

  window.__redraw = function(){
    ordinalStack(document.getElementById("enfChart"), segs);
    rankedBars(document.getElementById("topChart"), rows, 200, 96, 30, 12, true);
    rankedBars(document.getElementById("evChart"), evRows, 168, 58, 24, 15, false);
  };
  window.__redraw();
}

async function boot(){
  try{
    try{ TR = await grab("ui_translations.json"); }catch(err){ TR = null; }
    const all = await Promise.all(FILES.map(grab));
    TR = all[6];
    document.getElementById("app").hidden = false;
    paint(all[0], all[1], all[2], all[3], all[4], all[5]);
  }catch(e){
    document.getElementById("err").hidden = false;
    document.getElementById("errMsg").textContent = fill(t("gui_ov_load_error","Overview load failed: {err}"), [String(e && e.message || e)]) +
      "\n\nfetch base: " + SNAP + "  (served over http.server — not file://)";
  }
}
document.getElementById("themeBtn").addEventListener("click", function(){
  const root = document.documentElement;
  root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
  if (window.__redraw) window.__redraw();
});
let rt = 0;
window.addEventListener("resize", function(){
  clearTimeout(rt);
  rt = setTimeout(function(){ if (window.__redraw) window.__redraw(); }, 120);
});
boot();
