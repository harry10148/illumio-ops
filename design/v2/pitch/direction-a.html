<!doctype html>
<html lang="zh-Hant" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Direction A — Illumio Brand · Overview</title>
<style>
/* ============================================================
   DIRECTION A — Illumio Brand
   Palette + type per the official Illumio brand guidelines:
   Orange #FF5500 (accent only, never large fields), Server Slate
   #313638 (ink), System Cyan #2D454C (masthead), Zero Trust Tan
   #F7F4EE (page), Cloud Cerulean #E5F2F9 (cool fill).
   Tone system uses the brand tertiary set so status stays on-brand.
   ============================================================ */
:root{--font-brand:Montserrat,"Noto Sans CJK TC",Arial,sans-serif}
:root{--font-num:"Montserrat","DejaVu Sans Mono",monospace}
:root{
  color-scheme:light;
  --orange:#FF5500;
  --page:#F7F4EE;
  --surface:#FFFFFF;
  --surface-2:#FBF9F5;
  --cerulean:#E5F2F9;
  --line:#E4DED2;
  --line-soft:#EFEAE0;
  --ink:#313638;
  --ink-2:#5C6467;
  --ink-3:#8A9093;
  --cyan:#2D454C;
  --mast:#2D454C;
  --mast-ink:#FFFFFF;
  --ok:#166644;
  --warn:#B36A00;
  --crit:#BE122F;
  --info:#2D454C;
  --neutral:#6B7376;
  --ok-fill:#E7F1EB;
  --warn-fill:#FBF0DD;
  --crit-fill:#FAE7EA;
  --info-fill:#E5F2F9;
  --neutral-fill:#F0EFEC;
  --bar:#FF5500;
  --r1:#8FADB5;
  --r2:#688F9A;
  --r3:#456F7B;
  --r4:#2D454C;
  --grid:#EFEAE0;
  --shadow:0 1px 2px rgba(49,54,56,.05);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#25292B;
  --surface:#313638;
  --surface-2:#383E40;
  --cerulean:#2D454C;
  --line:#454C4E;
  --line-soft:#3C4245;
  --ink:#FFFFFF;
  --ink-2:#C4CACC;
  --ink-3:#98A0A2;
  --cyan:#9DC3CD;
  --mast:#1E2426;
  --mast-ink:#FFFFFF;
  --ok:#43A97B;
  --warn:#FFA22F;
  --crit:#E4566B;
  --info:#9DC3CD;
  --neutral:#A8AFB1;
  --ok-fill:#25403A;
  --warn-fill:#40361F;
  --crit-fill:#40282E;
  --info-fill:#2D454C;
  --neutral-fill:#3B4143;
  --bar:#FF7A33;
  --r1:#4B7C88;
  --r2:#6F9FAC;
  --r3:#9DC3CD;
  --r4:#CFE4EA;
  --grid:#3C4245;
  --shadow:none;
}
@media (prefers-color-scheme:dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --page:#25292B;
    --surface:#313638;
    --surface-2:#383E40;
    --cerulean:#2D454C;
    --line:#454C4E;
    --line-soft:#3C4245;
    --ink:#FFFFFF;
    --ink-2:#C4CACC;
    --ink-3:#98A0A2;
    --cyan:#9DC3CD;
    --mast:#1E2426;
    --ok:#43A97B;
    --warn:#FFA22F;
    --crit:#E4566B;
    --info:#9DC3CD;
    --neutral:#A8AFB1;
    --ok-fill:#25403A;
    --warn-fill:#40361F;
    --crit-fill:#40282E;
    --info-fill:#2D454C;
    --neutral-fill:#3B4143;
    --bar:#FF7A33;
    --r1:#4B7C88;
    --r2:#6F9FAC;
    --r3:#9DC3CD;
    --r4:#CFE4EA;
    --grid:#3C4245;
    --shadow:none;
  }
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;padding:0}
body{background:var(--page);color:var(--ink);font-family:var(--font-brand);font-size:14px;line-height:1.3;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}

/* ---------- masthead ---------- */
.mast{background:var(--mast);border-bottom:3px solid var(--orange)}
.mast-in{max-width:1376px;margin:0 auto;padding:0 32px;height:64px;display:flex;align-items:center;gap:40px}
.brand{display:flex;align-items:baseline;gap:2px;text-decoration:none}
.brand b{font-weight:600;font-size:20px;letter-spacing:-.02em;color:var(--mast-ink)}
.brand i{width:6px;height:6px;border-radius:50%;background:var(--orange);display:inline-block;margin-left:1px}
.brand span{margin-left:9px;font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:#9DC3CD}
.nav{display:flex;gap:26px;flex:1}
.nav a{position:relative;text-decoration:none;color:rgba(255,255,255,.72);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:23px 0;display:block}
.nav a em{display:block;font-style:normal;font-size:13px;font-weight:500;letter-spacing:0;text-transform:none;margin-bottom:2px;color:#fff;opacity:.82}
.nav a[aria-current]{color:#fff}
.nav a[aria-current] em{opacity:1}
.nav a[aria-current]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--orange)}
.mast-right{display:flex;align-items:center;gap:14px}
.tbtn{background:transparent;color:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.28);font-family:inherit;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:7px 11px;border-radius:2px;cursor:pointer}
.tbtn:hover{border-color:var(--orange);color:#fff}
.who{display:flex;align-items:center;gap:9px;padding-left:14px;border-left:1px solid rgba(255,255,255,.2)}
.who u{width:28px;height:28px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-size:9px;font-weight:700;letter-spacing:.06em;text-decoration:none}
.who div{line-height:1.25}
.who b{display:block;font-size:12px;font-weight:600;color:#fff}
.who small{display:block;font-size:10px;color:rgba(255,255,255,.55)}

/* ---------- health strip ---------- */
.hbar{background:var(--surface);border-bottom:1px solid var(--line)}
.hbar-in{max-width:1376px;margin:0 auto;padding:0 32px;display:flex;align-items:stretch}
.light{flex:1;padding:14px 20px 13px;border-left:1px solid var(--line-soft);min-width:0}
.light:first-child{border-left:0;padding-left:0}
.light .lk{display:flex;align-items:center;gap:7px;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.light .lv{margin-top:6px;font-size:16px;font-weight:500;color:var(--ink);letter-spacing:-.01em}
.light .ld{margin-top:3px;font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 0 3px var(--dotring)}
.t-ok{--dotc:var(--ok);--dotring:var(--ok-fill)}
.t-warn{--dotc:var(--warn);--dotring:var(--warn-fill)}
.t-crit{--dotc:var(--crit);--dotring:var(--crit-fill)}
.t-info{--dotc:var(--info);--dotring:var(--info-fill)}
.t-neutral{--dotc:var(--neutral);--dotring:var(--neutral-fill)}
.dot{background:var(--dotc)}
.hbar-meta{margin-left:auto;display:flex;align-items:center;gap:16px;padding-left:24px;font-size:11px;color:var(--ink-3);border-left:1px solid var(--line-soft)}

/* ---------- layout ---------- */
.wrap{max-width:1376px;margin:0 auto;padding:34px 32px 56px}
.eyebrow{margin:0 0 14px;font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--orange);display:flex;align-items:center;gap:12px}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--line)}
.sec{margin-bottom:34px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr);margin-top:16px}
.g57{grid-template-columns:5fr 7fr}
.g534{grid-template-columns:5fr 3fr 4fr}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:2px;padding:18px 20px 20px;box-shadow:var(--shadow);min-width:0;display:flex;flex-direction:column}
.card > h3{margin:0 0 14px;font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.card > h3 .sp{margin-left:auto;font-size:10px;font-weight:600;letter-spacing:.06em;color:var(--ink-3);text-transform:none}
.hero{display:flex;align-items:baseline;gap:8px}
.hero b{font-family:var(--font-num);font-size:44px;font-weight:300;letter-spacing:-.03em;line-height:1}
.hero i{font-style:normal;font-size:20px;font-weight:300;color:var(--ink-3)}
.hero span{font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);margin-left:2px}
.kv{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;border-top:1px solid var(--line-soft);font-size:12px;color:var(--ink-2);gap:12px}
.kv b{font-family:var(--font-num);font-weight:500;color:var(--ink);font-size:13px;font-variant-numeric:tabular-nums}
.kv:first-of-type{border-top:0}
.foot-note{margin-top:auto;padding-top:12px;font-size:11px;color:var(--ink-3);display:flex;gap:10px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:4px 9px;border-radius:2px;background:var(--neutral-fill);color:var(--ink-2);border:1px solid transparent}
.chip .dot{width:7px;height:7px;box-shadow:none}
.chip.on{background:var(--ok-fill);color:var(--ok)}
.chip.off{background:var(--neutral-fill);color:var(--neutral)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:2px;background:var(--dotring);color:var(--dotc)}

/* ---------- posture ---------- */
.pscore{display:flex;align-items:flex-end;gap:18px;margin-bottom:6px}
.pscore b{font-family:var(--font-num);font-size:78px;font-weight:300;line-height:.86;letter-spacing:-.05em;color:var(--dotc)}
.pscore .of{font-size:22px;font-weight:300;color:var(--ink-3);line-height:1.6}
.pscore .rt{margin-left:auto;text-align:right;font-size:11px;color:var(--ink-3);line-height:1.55}
.formula{font-family:var(--font-num);font-size:11px;color:var(--ink-3);margin:10px 0 16px;padding-bottom:14px;border-bottom:1px solid var(--line-soft);letter-spacing:.01em}
.comp{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:9px 0;border-bottom:1px solid var(--line-soft)}
.comp .cn{font-size:12.5px;color:var(--ink)}
.comp .cv{font-family:var(--font-num);font-size:13px;font-variant-numeric:tabular-nums;text-align:right;color:var(--ink)}
.comp .cw{grid-column:1/3;display:flex;align-items:center;gap:10px;font-size:10.5px;color:var(--ink-3)}
.mini{flex:1;height:4px;background:var(--grid);border-radius:2px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--r3);border-radius:2px}
.rmd{margin-top:14px}
.rmd h4{margin:0 0 9px;font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--orange)}
.rmd li{list-style:none;display:flex;gap:11px;padding:7px 0;font-size:12px;line-height:1.45;color:var(--ink-2);border-top:1px solid var(--line-soft)}
.rmd ul{margin:0;padding:0}
.rmd li b{font-family:var(--font-num);font-weight:600;color:var(--orange);white-space:nowrap;font-variant-numeric:tabular-nums}

/* ---------- tables / lists ---------- */
.rows{width:100%;border-collapse:collapse;font-size:12px}
.rows th{text-align:left;font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);padding:0 10px 7px 0;border-bottom:1px solid var(--line)}
.rows td{padding:7px 10px 7px 0;border-bottom:1px solid var(--line-soft);color:var(--ink-2);vertical-align:middle}
.rows td.n{font-family:var(--font-num);font-variant-numeric:tabular-nums;text-align:right;color:var(--ink);padding-right:0}
.rows tr:last-child td{border-bottom:0}
.mono{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.att{list-style:none;margin:0;padding:0}
.att li{padding:11px 0;border-top:1px solid var(--line-soft);display:grid;grid-template-columns:auto 1fr;gap:4px 10px}
.att li:first-child{border-top:0;padding-top:2px}
.att .sm{font-size:12.5px;color:var(--ink);line-height:1.4}
.att .rc{font-size:11px;color:var(--ink-3);grid-column:2;line-height:1.45}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);margin-bottom:14px}
.kpis div{background:var(--surface);padding:9px 10px}
.kpis dt{font-size:10px;color:var(--ink-3);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpis dd{margin:0;font-family:var(--font-num);font-size:17px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.empty{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:12px;padding:22px 18px;border:1px dashed var(--line);border-radius:2px;background:var(--surface-2)}
.empty p{margin:0;font-size:12.5px;color:var(--ink-2);line-height:1.55;max-width:26ch}
.empty .et{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.empty .bt{font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--orange);border:1px solid var(--orange);background:transparent;padding:7px 12px;border-radius:2px;cursor:pointer;font-family:inherit}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px}
.legend span{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--ink-2)}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
.legend b{font-family:var(--font-num);color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.pageft{margin-top:8px;padding-top:16px;border-top:1px solid var(--line);display:flex;gap:22px;font-size:11px;color:var(--ink-3);flex-wrap:wrap}
.errbox{max-width:760px;margin:64px auto;background:var(--crit-fill);border:1px solid var(--crit);border-left-width:4px;border-radius:2px;padding:20px 24px;color:var(--crit)}
.errbox h2{margin:0 0 8px;font-size:15px;font-weight:600}
.errbox pre{margin:0;white-space:pre-wrap;font-size:12px;color:var(--ink-2);font-family:var(--font-num)}
/* SVG marks wear CSS vars via classes so the chart follows data-theme */
svg text{font-family:var(--font-brand)}
.c-ink{fill:var(--ink)}
.c-ink2{fill:var(--ink-2)}
.c-ink3{fill:var(--ink-3)}
.c-bar{fill:var(--bar)}
.c-grid{stroke:var(--grid)}
.c-r1{fill:var(--r1)}
.c-r2{fill:var(--r2)}
.c-r3{fill:var(--r3)}
.c-r4{fill:var(--r4)}
.c-lab-lo{fill:var(--ink)}
.c-lab-hi{fill:var(--surface)}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block}
.sw1{background:var(--r1)}
.sw2{background:var(--r2)}
.sw3{background:var(--r3)}
.sw4{background:var(--r4)}
</style>
</head>
<body>
<div id="app" hidden>
  <header class="mast">
    <div class="mast-in">
      <a class="brand" href="#"><b>illumio</b><i></i><span>ops</span></a>
      <nav class="nav">
        <a href="#" aria-current="page"><em>總覽</em>Overview</a>
        <a href="#"><em>調查</em>Investigate</a>
        <a href="#"><em>告警</em>Alerting</a>
        <a href="#"><em>自動化</em>Automation</a>
        <a href="#"><em>報表</em>Reports</a>
        <a href="#"><em>系統</em>System</a>
      </nav>
      <div class="mast-right">
        <button class="tbtn" id="themeBtn" type="button">Theme</button>
        <div class="who"><u>OPS</u><div><b id="whoHost"></b><small id="whoMeta"></small></div></div>
      </div>
    </div>
  </header>

  <div class="hbar"><div class="hbar-in"><div id="lights" style="display:flex;flex:1"></div><div class="hbar-meta" id="hbMeta"></div></div></div>

  <main class="wrap">
    <section class="sec">
      <p class="eyebrow" id="eyeOps"></p>
      <div class="grid g4">
        <article class="card" id="cVen"></article>
        <article class="card" id="cEnf"></article>
        <article class="card" id="cBlk"></article>
        <article class="card" id="cTls"></article>
      </div>
      <div class="grid g3">
        <article class="card" id="cPipe"></article>
        <article class="card" id="cJobs"></article>
        <article class="card" id="cAlerts"></article>
      </div>
    </section>

    <section class="sec">
      <p class="eyebrow" id="eyeSec"></p>
      <div class="grid g57">
        <article class="card" id="cPosture"></article>
        <article class="card" id="cTop"></article>
      </div>
    </section>

    <section class="sec">
      <div class="grid g534">
        <article class="card" id="cAudit"></article>
        <article class="card" id="cPu"></article>
        <article class="card" id="cRep"></article>
      </div>
    </section>

    <footer class="pageft" id="pageFoot"></footer>
  </main>
</div>

<div id="err" class="errbox" hidden><h2>無法載入總覽資料</h2><pre id="errMsg"></pre></div>

<script>
/* ---------- snapshot plumbing (no hand-written data) ---------- */
const SNAP = "../snapshots/";
const FILES = ["status.json","dashboard_overview.json","dashboard_audit.json","dashboard_pu.json","top10.json","reports_list.json","ui_translations.json"];
const NF = new Intl.NumberFormat("en-US");
let TR = null;

async function grab(name){
  const res = await fetch(SNAP + name);
  if (!res.ok) throw new Error(name + " → HTTP " + res.status);
  return res.json();
}
function t(key, fb){
  const v = TR && TR[key];
  if (typeof v === "string" && v.length) return v;
  return fb === undefined ? key : fb;
}
function fill(str, vals){
  let i = 0;
  return String(str).replace(/\{[a-z_]+\}/g, function(){ return vals[i++]; });
}
function esc(s){
  return String(s === null || s === undefined ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function num(v){ return NF.format(Number(v) || 0); }
function firstLine(s){
  const one = String(s || "").split("\n")[0].trim();
  return one.length > 74 ? one.slice(0,74) + "…" : one;
}
function stamp(iso){
  return String(iso || "").replace("T"," ").replace(/\.\d+/,"").replace("Z","").replace(/\+00:00$/,"").trim();
}
function dur(sec){
  const s = Math.max(0, Math.round(Number(sec) || 0));
  if (s < 90) return s + "s";
  if (s < 5400) return Math.round(s/60) + "m";
  if (s < 172800) return Math.round(s/3600) + "h";
  return Math.round(s/86400) + "d";
}
function since(iso, refIso){
  const a = Date.parse(iso), b = Date.parse(refIso);
  if (!isFinite(a) || !isFinite(b)) return "—";
  return dur((b - a) / 1000);
}
function tone(level){
  const s = String(level || "").toLowerCase();
  if (s === "ok" || s === "success" || s === "online" || s === "pass") return "ok";
  if (s === "warn" || s === "warning" || s === "degraded" || s === "medium") return "warn";
  if (s === "crit" || s === "critical" || s === "error" || s === "fail" || s === "failed" || s === "offline" || s === "high") return "crit";
  if (s === "info" || s === "low") return "info";
  return "neutral";
}
function toneWord(tn){
  if (tn === "ok") return t("gui_status_pill_label_success");
  if (tn === "warn") return t("gui_status_pill_label_warning");
  if (tn === "crit") return t("gui_status_pill_label_danger");
  if (tn === "info") return t("gui_status_pill_label_info");
  return t("gui_status_pill_label_neutral");
}
function worst(levels){
  const rank = ["ok","info","neutral","warn","crit"];
  let out = "ok";
  levels.forEach(function(l){ const tn = tone(l); if (rank.indexOf(tn) > rank.indexOf(out)) out = tn; });
  return out;
}
const CHART_FONT = 'Montserrat, "Noto Sans CJK TC", Arial, sans-serif';
let _ctx = null;
function textw(str, px){
  if (!_ctx) _ctx = document.createElement("canvas").getContext("2d");
  _ctx.font = px + "px " + CHART_FONT;
  return _ctx.measureText(String(str)).width;
}
function clipText(str, maxw, px){
  let s = String(str);
  if (textw(s, px) <= maxw) return s;
  while (s.length > 1 && textw(s + "…", px) > maxw) s = s.slice(0, -1);
  return s + "…";
}

/* ---------- SVG chart primitives ---------- */
function capPath(x, y, w, h, r){
  const rr = Math.max(0, Math.min(r, w, h/2));
  return "M" + x + "," + y + " H" + (x + w - rr) +
    " A" + rr + "," + rr + " 0 0 1 " + (x + w) + "," + (y + rr) +
    " V" + (y + h - rr) +
    " A" + rr + "," + rr + " 0 0 1 " + (x + w - rr) + "," + (y + h) +
    " H" + x + " Z";
}
/* Ranked horizontal bars: one series → one hue; value at each tip, no axis. */
function rankedBars(host, rows, labelW, valueW){
  const W = Math.max(360, host.clientWidth);
  const rowH = 40, barH = 11, top = 6, pad = 14;
  const H = rows.length * rowH + top;
  const x0 = labelW, x1 = W - valueW;
  const span = Math.max(40, x1 - x0);
  const max = rows.reduce(function(m, r){ return Math.max(m, r[2]); }, 0) || 1;
  let s = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="img">';
  rows.forEach(function(r, i){
    const y = top + i * rowH;
    const bw = Math.max(3, Math.round(span * (r[2] / max)));
    s += '<line class="c-grid" x1="0" y1="' + (y + rowH - 4) + '" x2="' + W + '" y2="' + (y + rowH - 4) + '" stroke-width="1"/>';
    s += '<text class="c-ink" x="0" y="' + (y + 13) + '" font-size="12">' + esc(clipText(r[0], labelW - pad, 12)) + '</text>';
    s += '<text class="c-ink3" x="0" y="' + (y + 27) + '" font-size="10.5">' + esc(clipText(r[1], labelW - pad, 10.5)) + '</text>';
    s += '<path class="c-bar" d="' + capPath(x0, y + 9, bw, barH, 4) + '"/>';
    s += '<text class="c-ink2" x="' + (x0 + bw + 10) + '" y="' + (y + 19) + '" font-size="11.5" font-variant-numeric="tabular-nums">' + esc(r[3]) + '</text>';
  });
  s += "</svg>";
  host.innerHTML = s;
}
/* Ordinal composition: one hue, ordered steps, 2px surface gaps. */
function ordinalStack(host, segs){
  const W = Math.max(200, host.clientWidth), H = 26, gap = 2;
  const total = segs.reduce(function(a, s){ return a + s[1]; }, 0) || 1;
  const live = segs.filter(function(s){ return s[1] > 0; });
  const usable = W - gap * Math.max(0, live.length - 1);
  let x = 0, s = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="img">';
  segs.forEach(function(seg, i){
    if (seg[1] <= 0) return;
    const w = Math.max(6, Math.round(usable * (seg[1] / total)));
    s += '<rect class="c-r' + (i + 1) + '" x="' + x + '" y="0" width="' + w + '" height="' + H + '" rx="2"/>';
    const lab = String(seg[1]);
    if (w > textw(lab, 11.5) + 20){
      s += '<text class="' + (i >= 2 ? "c-lab-hi" : "c-lab-lo") + '" x="' + (x + 10) + '" y="' + (H/2 + 4) + '" font-size="11.5" font-weight="600">' + lab + '</text>';
    }
    x += w + gap;
  });
  s += "</svg>";
  host.innerHTML = s;
}

/* ---------- render ---------- */
function paint(st, ov, au, pu, top, rl){
  const ref = ov.as_of;
  const ven = ov.ven || {}, enf = ov.enforcement || {}, blk = ov.blocked || {}, pipe = ov.pipeline || {}, tls = ov.tls || {}, po = ov.posture || {}, al = ov.alerts || {};
  const jobs = ov.job_health || [];
  const chans = st.alert_channels || [];
  const pce = st.pce_stats || {};

  document.getElementById("whoHost").textContent = String(st.api_url || "").replace(/^https?:\/\//, "");
  document.getElementById("whoMeta").textContent = "v" + st.version + " · " + st.timezone;
  document.getElementById("eyeOps").textContent = t("gui_ov_eyebrow_ops");
  document.getElementById("eyeSec").textContent = t("gui_ov_eyebrow_security");

  /* --- 5 semantic lights --- */
  const badJobs = jobs.filter(function(j){ return j.level !== "ok"; });
  const lags = pipe.cache_lag || [];
  const maxLag = lags.reduce(function(m, l){ return Math.max(m, l.lag_s || 0); }, 0);
  const liveCh = chans.filter(function(c){ return c.enabled && c.configured; });
  const failCh = liveCh.filter(function(c){ return c.last_status && c.last_status !== "success"; });
  const lights = [];
  lights.push([t("gui_ov_job_health"), badJobs.length ? worst(badJobs.map(function(j){ return j.level; })) : "ok",
    (jobs.length - badJobs.length) + "/" + jobs.length, t("gui_jh_th_last_run") + " " + since(jobs.length ? jobs[0].last_run : ref, ref)]);
  lights.push([t("gui_dashboard_pce_health"),
    pce.consecutive_failures > 0 ? "crit" : (pce.last_error ? "warn" : tone(pce.health_status)),
    String(pce.health_status || "").toUpperCase(),
    pce.last_error ? (pce.last_error_stage + " · " + firstLine(pce.last_error)) : (t("gui_ov_as_of") + " " + since(pce.last_success, ref))]);
  lights.push([t("gui_ov_cache_lag_label"), worst(lags.map(function(l){ return l.level; })), dur(maxLag),
    lags.map(function(l){ return l.source + " " + dur(l.lag_s); }).join(" · ")]);
  lights.push([t("gui_ov_pipeline_title"), tone(pipe.verdict), pipe.siem_success_1h + "%",
    t("gui_ov_dlq") + " " + num(pipe.dlq) + " · " + t("gui_ov_siem_success_1h")]);
  lights.push([t("gui_ov_alert_channels"), failCh.length ? "crit" : (liveCh.length ? "info" : "neutral"),
    liveCh.length + "/" + chans.length,
    liveCh.map(function(c){ return c.name; }).join(" · ") + " " + t("gui_ov_ch_configured")]);

  document.getElementById("lights").innerHTML = lights.map(function(l){
    return '<div class="light t-' + l[1] + '"><div class="lk"><span class="dot"></span>' + esc(l[0]) +
      '</div><div class="lv">' + esc(l[2]) + '</div><div class="ld" title="' + esc(l[3]) + '">' + esc(l[3]) + '</div></div>';
  }).join("");
  document.getElementById("hbMeta").innerHTML =
    '<span>' + esc(t("gui_ov_as_of")) + ' <b class="mono">' + esc(stamp(ref)) + '</b></span>' +
    '<span>' + esc(t("gui_ov_autorefresh")) + '</span>';

  /* --- VEN --- */
  const venT = tone(ven.verdict);
  document.getElementById("cVen").innerHTML =
    '<h3>' + esc(t("gui_ov_ven_title")) + '<span class="sp tag t-' + venT + '">' + esc(toneWord(venT)) + '</span></h3>' +
    '<div class="hero t-' + venT + '"><b>' + ven.online + '</b><i>/ ' + ven.total + '</i><span>' + esc(t("gui_ov_online")) + '</span></div>' +
    '<div class="chips"><span class="chip off"><span class="dot t-crit" style="background:var(--crit)"></span>' + esc(t("gui_ov_offline")) + ' ' + ven.offline + '</span>' +
    '<span class="chip off"><span class="dot" style="background:var(--warn)"></span>degraded ' + ven.degraded + '</span></div>' +
    '<div class="foot-note"><span>' + esc(t("gui_ov_oldest_hb")) + ' ' + dur(ven.oldest_heartbeat_age_s) + '</span><span class="mono">' + esc(stamp(ven.computed_at)) + '</span></div>';

  /* --- Enforcement (ordinal ramp) --- */
  const modes = enf.by_mode || {};
  const order = ["idle","visibility_only","selective","full"];
  const segs = order.map(function(k){ return [k, Number(modes[k]) || 0]; });
  const osd = (ov.os_dist && ov.os_dist.by_family) || {};
  document.getElementById("cEnf").innerHTML =
    '<h3>' + esc(t("gui_ov_enforcement_modes")) + '<span class="sp">' + esc(t("gui_ov_total")) + ' ' + enf.total + '</span></h3>' +
    '<div id="enfChart"></div><div class="legend">' + segs.map(function(s, i){
      return '<span><i class="sw sw' + (i + 1) + '"></i>' + esc(s[0]) + ' <b>' + s[1] + '</b></span>';
    }).join("") + '</div>' +
    '<div class="foot-note"><span>' + esc(t("gui_ov_os_dist")) + '</span>' +
    Object.keys(osd).map(function(k){ return '<span>' + esc(k) + ' <b class="mono" style="color:var(--ink-2)">' + osd[k] + '</b></span>'; }).join("") + '</div>';

  /* --- Blocked --- */
  const blkT = tone(blk.verdict);
  document.getElementById("cBlk").innerHTML =
    '<h3>' + esc(t("gui_ov_blocked_title")) + '<span class="sp">' + blk.window_days + 'd</span></h3>' +
    '<div class="hero t-' + blkT + '"><b>' + num(blk.blocked) + '</b><span>' + esc(t("gui_pd_blocked")) + '</span></div>' +
    '<div style="margin-top:12px"><div class="kv"><span>' + esc(t("gui_pd_potential")) + '</span><b>' + num(blk.potential) + '</b></div>' +
    '<div class="kv"><span>' + esc(t("gui_pd_allowed")) + '</span><b>' + num(blk.allowed) + '</b></div>' +
    '<div class="kv t-' + (blk.vs_prev_pct <= 0 ? "ok" : "warn") + '"><span>' + esc(t("gui_ov_vs_prev")) + '</span><b style="color:var(--dotc)">' + blk.vs_prev_pct + '%</b></div></div>';

  /* --- TLS --- */
  const tlsT = tls.check_failed ? "crit" : (tls.expiring_soon ? "warn" : "ok");
  document.getElementById("cTls").innerHTML =
    '<h3>' + esc(t("gui_ov_tls_cert")) + '<span class="sp tag t-' + tlsT + '">' + esc(toneWord(tlsT)) + '</span></h3>' +
    '<div class="hero t-' + tlsT + '"><b>' + num(tls.days_remaining) + '</b><span>' + esc(t("gui_ov_tls_days")) + '</span></div>' +
    '<div class="chips"><span class="chip ' + (tls.enabled ? "on" : "off") + '">HTTPS ' + (tls.enabled ? "on" : "off") + '</span></div>' +
    '<div class="foot-note"><span>' + esc(t("gui_health_check")) + ' ' + (st.health_check ? t("gui_status_ok") : t("gui_status_fail")) + '</span></div>';

  /* --- Pipeline --- */
  document.getElementById("cPipe").innerHTML =
    '<h3>' + esc(t("gui_ov_pipeline_title")) + '<span class="sp tag t-' + tone(pipe.verdict) + '">' + esc(toneWord(tone(pipe.verdict))) + '</span></h3>' +
    '<div class="kv"><span>' + esc(t("gui_ov_siem_success_1h")) + '</span><b>' + pipe.siem_success_1h + '%</b></div>' +
    '<div class="kv"><span>' + esc(t("gui_ov_dlq_total")) + '</span><b>' + num(pipe.dlq) + '</b></div>' +
    lags.map(function(l){
      return '<div class="kv"><span>' + esc(t("gui_ov_cache_lag_label")) + ' · ' + esc(l.source) + '</span><b class="t-' + tone(l.level) + '" style="color:var(--dotc)">' + dur(l.lag_s) + '</b></div>';
    }).join("") +
    '<div class="foot-note"><span>' + esc(t("gui_ov_siem_queue")) + ' ' + (pipe.siem_idle ? "idle" : "active") + '</span></div>';

  /* --- Jobs --- */
  const shown = jobs.slice(0, 4);
  document.getElementById("cJobs").innerHTML =
    '<h3>' + esc(t("gui_ov_job_health")) + '<span class="sp">' + (jobs.length - badJobs.length) + '/' + jobs.length + '</span></h3>' +
    '<table class="rows"><thead><tr><th>' + esc(t("gui_jh_th_job")) + '</th><th>' + esc(t("gui_jh_th_interval")) + '</th><th style="text-align:right">' + esc(t("gui_jh_th_last_run")) + '</th></tr></thead><tbody>' +
    shown.map(function(j){
      return '<tr><td><span class="dot t-' + tone(j.level) + '" style="background:var(--dotc);display:inline-block;margin-right:7px;box-shadow:none"></span>' + esc(j.job_id) +
        '</td><td class="mono">' + dur(j.interval_seconds) + '</td><td class="n">' + since(j.last_run, ref) + '</td></tr>';
    }).join("") + '</tbody></table>' +
    '<div class="foot-note"><span>+' + (jobs.length - shown.length) + ' more</span><span>' + esc(t("gui_jh_overdue")) + ' ' + badJobs.length + '</span></div>';

  /* --- Alerts --- */
  document.getElementById("cAlerts").innerHTML =
    '<h3>' + esc(t("gui_ov_alerts_title")) + '<span class="sp tag t-' + tone(al.verdict) + '">' + esc(toneWord(tone(al.verdict))) + '</span></h3>' +
    '<div class="kv"><span>' + esc(t("gui_ov_fired_24h")) + '</span><b>' + num(al.fired_24h) + '</b></div>' +
    '<div class="kv"><span>' + esc(t("gui_ov_failed")) + '</span><b>' + num(al.failed) + '</b></div>' +
    '<div class="kv"><span>' + esc(t("gui_ov_suppressed")) + '</span><b>' + num(al.suppressed) + '</b></div>' +
    '<div class="chips">' + chans.map(function(c){
      return '<span class="chip ' + (c.configured && c.enabled ? "on" : "off") + '">' + esc(c.name) + '</span>';
    }).join("") + '</div>' +
    '<div class="foot-note"><span>' + esc(t("gui_ov_recent_events")) + ' ' + ((al.recent || []).length) + '</span></div>';

  /* --- Posture --- */
  const score = Number(po.score) || 0;
  const pT = score >= 75 ? "ok" : (score >= 50 ? "warn" : "crit");
  const comps = po.components || [];
  const rmd = (po.remediation || []).slice(0, 3);
  document.getElementById("cPosture").innerHTML =
    '<h3>' + esc(t("gui_ov_posture_score_label")) + '<span class="sp tag t-' + pT + '">' + esc(toneWord(pT)) + '</span></h3>' +
    '<div class="pscore t-' + pT + '"><b>' + score + '</b><span class="of">/100</span>' +
    '<span class="rt">' + esc(t("gui_ov_as_of")) + '<br><span class="mono">' + esc(stamp(po.source_date)) + '</span></span></div>' +
    '<p class="formula">' + esc(po.formula) + '</p>' +
    comps.map(function(c){
      const pct = Math.max(0, Math.min(100, Number(c.value) || 0));
      return '<div class="comp"><span class="cn">' + esc(t(c.label_key)) + '</span>' +
        '<span class="cv">' + c.value + c.unit + '</span>' +
        '<span class="cw"><span class="mini"><i style="width:' + pct + '%"></i></span>' +
        esc(t("gui_posture_modal_col_weight")) + ' ' + c.weight + ' · ' + esc(t("gui_posture_modal_col_points")) + ' ' + c.points + '</span></div>';
    }).join("") +
    '<div class="rmd"><h4>' + esc(t("gui_posture_rmd_title")) + '</h4><ul>' +
    rmd.map(function(r){
      return '<li><b>+' + r.recoverable_points + '</b><span>' + esc(t(r.recommendation_key)) + '</span></li>';
    }).join("") + '</ul></div>';

  /* --- Top 10 traffic --- */
  const rows = (top.data || []).map(function(r){
    return [r.s_name + "  " + r.dir + "  " + r.d_name, r.svc + " · " + r.s_ip + " → " + r.d_ip, parseFloat(r.val_fmt) || 0, r.val_fmt];
  });
  const trunc = top.truncated ? fill(t("gui_ov_truncated_fmt"), [t("gui_ov_drill_traffic"), top.data.length, top.total]) : (num(top.total) + " " + t("gui_ov_rows"));
  document.getElementById("cTop").innerHTML =
    '<h3>Top 10 · ' + esc(t("gui_ov_traffic")) + '<span class="sp">' + esc(top.source) + ' · ' + esc(trunc) + '</span></h3>' +
    '<div id="topChart"></div>';

  /* --- Audit --- */
  const su = au.summary || {};
  const kpis = (su.kpis || []).slice(0, 8);
  const att = (su.attention_items || []).slice(0, 3);
  document.getElementById("cAudit").innerHTML =
    '<h3>' + esc(t("gui_dashboard_audit_summary")) + '<span class="sp mono">' + esc((su.date_range || []).join(" → ")) + '</span></h3>' +
    '<dl class="kpis">' + kpis.map(function(k){
      return '<div><dt title="' + esc(k.label) + '">' + esc(k.label) + '</dt><dd>' + esc(k.value) + '</dd></div>';
    }).join("") + '</dl>' +
    '<h4 style="margin:0 0 8px;font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--orange)">' + esc(t("gui_dashboard_audit_attention")) + '</h4>' +
    '<ul class="att">' + att.map(function(a){
      const tn = tone(a.risk);
      return '<li><span class="tag t-' + tn + '">' + esc(a.risk) + '</span><span class="sm">' + esc(a.summary) + ' <b class="mono">×' + a.count + '</b></span>' +
        '<span class="rc">' + esc(a.event_type) + ' — ' + esc(a.recommendation) + '</span></li>';
    }).join("") + '</ul>';

  /* --- Policy usage (真實空狀態) --- */
  document.getElementById("cPu").innerHTML =
    '<h3>' + esc(t("gui_dashboard_policy_usage_summary")) + '<span class="sp tag t-neutral">' + esc(toneWord("neutral")) + '</span></h3>' +
    '<div class="empty"><span class="et">' + esc(t("gui_reports_empty_title")) + '</span><p>' + esc(pu.error || t("gui_dashboard_no_policy_usage_summary")) + '</p>' +
    '<button class="bt" type="button">' + esc(t("gui_ov_posture_run_now")) + '</button></div>';

  /* --- Reports --- */
  const reps = (rl.reports || []).slice().sort(function(a, b){ return b.mtime - a.mtime; });
  const kinds = [];
  reps.forEach(function(r){
    const k = r.report_type || "—";
    let hit = null;
    kinds.forEach(function(x){ if (x[0] === k) hit = x; });
    if (hit) hit[1] += 1; else kinds.push([k, 1]);
  });
  document.getElementById("cRep").innerHTML =
    '<h3>' + esc(t("gui_tab_reports")) + '<span class="sp">' + reps.length + ' ' + esc(t("gui_ov_rows")) + '</span></h3>' +
    '<table class="rows"><tbody>' + reps.slice(0, 5).map(function(r){
      return '<tr><td>' + esc(r.report_type || "—") + '<div style="font-size:10.5px;color:var(--ink-3);margin-top:2px">' + esc(r.filename) + '</div></td>' +
        '<td class="n">' + Math.round(r.size / 1024) + ' KB</td></tr>';
    }).join("") + '</tbody></table>' +
    '<div class="chips">' + kinds.slice(0, 4).map(function(k){
      return '<span class="chip">' + esc(k[0] || "—") + ' <b class="mono">' + k[1] + '</b></span>';
    }).join("") + '</div>';

  document.getElementById("pageFoot").innerHTML =
    '<span>PCE <b class="mono">' + esc(st.api_url) + '</b></span>' +
    '<span>' + esc(t("gui_ov_events")) + ' <b class="mono">' + num(pce.last_batch_total) + '</b></span>' +
    '<span>' + esc(t("gui_dashboard_rules")) + ' <b class="mono">' + num(st.rules_count) + '</b></span>' +
    '<span>' + esc(t("gui_ov_as_of")) + ' <b class="mono">' + esc(stamp(ref)) + ' ' + esc(st.timezone) + '</b></span>';

  /* charts need layout width → paint after the cards are in the DOM */
  window.__redraw = function(){
    ordinalStack(document.getElementById("enfChart"), segs);
    rankedBars(document.getElementById("topChart"), rows, 214, 104);
  };
  window.__redraw();
}

async function boot(){
  try{
    try{ TR = await grab("ui_translations.json"); }catch(err){ TR = null; }
    const all = await Promise.all(FILES.map(grab));
    TR = all[6];
    document.getElementById("app").hidden = false;
    paint(all[0], all[1], all[2], all[3], all[4], all[5]);
  }catch(e){
    document.getElementById("err").hidden = false;
    document.getElementById("errMsg").textContent = fill(t("gui_ov_load_error","Overview load failed: {err}"), [String(e && e.message || e)]) +
      "\n\nfetch base: " + SNAP + "  (以 http.server 提供，勿用 file://)";
  }
}
document.getElementById("themeBtn").addEventListener("click", function(){
  const root = document.documentElement;
  root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
  if (window.__redraw) window.__redraw();
});
let rt = 0;
window.addEventListener("resize", function(){
  clearTimeout(rt);
  rt = setTimeout(function(){ if (window.__redraw) window.__redraw(); }, 120);
});
boot();
</script>
