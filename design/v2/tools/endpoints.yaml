# ── GET，path 依賴另一筆已抓快照的第一筆資料（capture_snapshots.py 執行期解析）──
# path_from 語法：<snapshot_id>.<jsonpath>；resolve_path_from() 依序解析
# dict key／list[0] 兩種寫法。抓取順序依 yaml 由上而下，故被依賴的快照必須排在前面。
- id: rs_ruleset_detail
  method: GET
  # src/gui/routes/rule_scheduler.py:191 @bp.route('/api/rule_scheduler/rulesets/<rs_id>')
  path: "/api/rule_scheduler/rulesets/{rs_id}"
  path_from: "rs_rulesets.items[0].id"
  note: "rs_id 取自 rs_rulesets 快照第一筆 items[].id"
- id: report_sched_history
  method: GET
  # src/gui/routes/reports.py:1221 @bp.route('/api/report-schedules/<int:schedule_id>/history')
  path: "/api/report-schedules/{schedule_id}/history"
  path_from: "report_schedules.schedules[0].id"
  note: "schedule_id 取自 report_schedules 快照第一筆 schedules[].id"
- id: module_log_sample
  method: GET
  # src/gui/routes/admin.py:30 @bp.route('/api/logs/<module_name>')
  path: "/api/logs/{module_name}"
  path_from: "logs_index.modules[0].name"
  note: "module_name 取自 logs_index 快照第一個 modules[].name"

# ── POST（body 鍵名轉錄自 Step 1 呼叫端；值用測試機上合理的查詢參數）───────
- id: traffic_search
  method: POST
  path: /api/quarantine/search
  # src/static/js/quarantine.js:271-293 runTrafficAnalyzer()
  #   mins/sort_by/search 讀自 #qt-mins/#qt-sort/#qt-search；
  #   source 讀自 #traffic-source（預設 'live'）；
  #   policy_decision 讀自 qt-pd-radio（未選則 '-1'＝全部）；
  #   draft_policy_decision 僅在 qt-dpd-radio 有勾選時才附加（此處示範情境不勾）；
  #   Object.assign(payload, filterBar.getFilters()) 會疊加 FilterBar pill
  #   （services/ports/process_name/.../any_label 等），空 pill 時不產生任何鍵。
  payload:
    mins: 1440          # 24h 時間窗（分鐘）
    sort_by: bandwidth  # #qt-sort 預設選項（第一個 <option>）
    search: ""
    source: live         # #traffic-source 預設值
    policy_decision: "-1" # 未勾選 radio 時的預設值（全部）
- id: workload_search
  method: GET
  # src/static/js/quarantine.js:518-534 runWorkloadSearch()：實際發出的是
  # GET /api/workloads?name=&ip_address=&hostname=（qp URLSearchParams），
  # 函式內組出的 `payload` dict 從未被送出——原始碼為準，不採計畫草稿的 POST。
  path: "/api/workloads?name=&ip_address=&hostname="
- id: top10
  method: POST
  path: /api/dashboard/top10
  # src/static/js/dashboard.js:2048-2051 runTop10Query()：payload = { ...q, mins }，
  # q 取自 _dashboardQueries[idx]（GET /api/dashboard/queries 的一筆，
  # dashboard.js:1405 直接回傳 cm.config['settings']['dashboard_queries']）。
  # 该儲存陣列的真實形狀由 src/gui/routes/dashboard.py:539-546
  # (api_save_dashboard_query) 決定：filters dict 在儲存當下就被依 whitelist
  # 展平進頂層 flat key（src_labels/ports/port/proto/...），從不含巢狀
  # `filters` 鍵——先前版本誤把「送出去儲存」的 request body 形狀
  # （dashboard.js:1868-1875 saveDashboardQuery，有 filters 鍵）當成
  # 「查詢時讀出來」的 stored-query 形狀，兩者是生命週期的不同階段。
  # api_dashboard_top10（dashboard.py:649-729）也只讀 d.get("name in flat
  # keys 如 port/proto/src_label/ports 等，從未讀 d.get("filters")。
  # 這裡採最小忠實呼叫：{name, rank_by, pd, mins}（不含任何 flat 篩選鍵，
  # 對應「未加篩選的已存查詢」）。
  payload:
    name: "Top10 Demo"
    rank_by: bandwidth   # dq-rank 第三個 <option>，對應 gui_rank_bw
    pd: 3                 # dq-pd 預設 radio（3＝全部）
    mins: 1440
- id: fb_suggest
  method: GET
  # src/static/js/filter-bar.js:759 `/api/filter-objects/suggest?q=${q}&types=${types}&limit=10`
  path: "/api/filter-objects/suggest?q=web&types=label&limit=10"
- id: fb_browse
  method: GET
  # src/static/js/filter-bar.js:653 `/api/filter-objects/browse?type=${cat}&offset=${offset}&limit=20`
  path: "/api/filter-objects/browse?type=label&offset=0&limit=20"
- id: alert_detail
  method: GET
  # src/gui/routes/alerts.py @bp.route('/api/alerts/<int:alert_id>')
  path: "/api/alerts/{id}"
  path_from: "alerts.items[0].id"
  note: "id 取自 alerts 快照第一筆 items[].id"
- id: alert_traffic_query
  method: GET
  # src/gui/routes/alerts.py @bp.route('/api/alerts/<int:alert_id>/traffic_query');
  # lab 快照的第一筆是 event 告警，所以錄下的是 400 not_traffic 的形狀
  path: "/api/alerts/{id}/traffic_query"
  path_from: "alerts.items[0].id"
  note: "id 取自 alerts 快照第一筆 items[].id"
