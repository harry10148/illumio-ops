# design/v2/tools/endpoints.yaml — id 對應 snapshots/<id>.json
#
# 轉錄來源（source-first；每個 POST/query payload 鍵名皆逐一核對呼叫端 JS）：
#   - traffic_search : src/static/js/quarantine.js:271-296 (runTrafficAnalyzer)
#   - workload_search: src/static/js/quarantine.js:518-534 (runWorkloadSearch)
#       實際是 GET /api/workloads?<qs>（JS 組了一個 `payload` dict 但從未送出，
#       真正呼叫是 fetch('/api/workloads?' + qp.toString())；此處以原始碼為準，
#       更正計畫草稿裡誤植的 POST）。
#   - top10          : src/static/js/dashboard.js:2048-2058 (runTop10Query，消費端) +
#                       src/gui/routes/dashboard.py:539-546 (api_save_dashboard_query，
#                       決定「已存查詢」的真實 flat 形狀——filters dict 在儲存時就被
#                       展平，stored query 從不含巢狀 filters 鍵) +
#                       src/gui/routes/dashboard.py:649-729 (api_dashboard_top10，
#                       只讀 flat key，證實未讀 d.get("filters"))
#   - fb_suggest      : src/static/js/filter-bar.js:757-760 (_objfbFetchSuggest)
#   - fb_browse       : src/static/js/filter-bar.js:653      (一般 browse 呼叫；
#                       550 的 type=_totals 呼叫是同一支路由的另一種查詢，不另建 id)
#
# `mask: catalog` 旗標（2026-08-03 使用者裁決＋2026-08-03 二次修訂）：該端點的
# 字典鍵名本身是 identifier（i18n key／event type key／表單 schema 描述），
# 不是機密欄位名——套一般語意式 key 遮罩會把非機密內容一併打光。
# capture_snapshots.py 改呼叫 masking.mask_values_only()：完全跳過 key
# 判定，只掃長 hex 值。三個：
#   - event_catalog / ui_translations：鍵是 i18n/事件型別 key，值是顯示文字
#     （gui_password 是「密碼」欄位的顯示字串、agent.refresh_token 是事件
#     型別代碼，都不是憑證本尊）。
#   - alert_plugins：src/gui/routes/config.py:151-178 api_alert_plugins() 只
#     從編譯期常數 PLUGIN_METADATA 組出表單 schema，從不含任何即時設定值；
#     其中 "secret": field.secret（src/alerts/metadata.py:15 FieldMeta.secret:
#     bool）是「這個欄位要不要用密碼框顯示」的 UI 布林旗標，不是密碼本尊。
#     語意式規則命中 key 名 "secret" 會連 SMTP host/寄件者/收件者等完全
#     無關欄位也一併打光（實測驗證：全部 5 插件 14 個欄位描述被清空）。

