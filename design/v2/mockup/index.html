<!doctype html>
<html lang="zh-Hant" data-theme="dark" data-density="cozy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>illumio-ops · design v2 mockup</title>
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/components.css">
<link rel="stylesheet" href="assets/app.css">
<script>
/* Paint the persisted theme/density before first paint — no flash of the wrong
   surface. theme.mjs owns every change after this point. */
(function () {
  try {
    var th = localStorage.getItem("ov2.theme");
    var de = localStorage.getItem("ov2.density");
    if (th === "light" || th === "dark") document.documentElement.dataset.theme = th;
    if (de === "cozy" || de === "compact") document.documentElement.dataset.density = de;
  } catch (e) { /* private mode: fall back to the markup defaults */ }
})();
</script>
</head>
<body>
<div id="shell"></div>
<main id="area-root"></main>
<script type="module" src="js/app.mjs"></script>
</body>
</html>
