<!doctype html>
<html lang="zh-Hant" data-theme="dark" data-density="cozy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>design v2 · component harness</title>
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/components.css">
<link rel="stylesheet" href="assets/app.css">
<style>
/* harness-only layout; every color still comes from tokens.css */
#dev-root { padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-5); max-width: 1100px; }
.dev-head { display: flex; align-items: baseline; gap: var(--space-5); }
.dev-head h1 { margin: 0; font-size: var(--fs-lead); }
.dev-head code { font-family: var(--font-mono); font-size: var(--fs-mini); color: var(--text-3); }
.dev-row { display: flex; flex-wrap: wrap; gap: var(--space-4); align-items: center; }
.dev-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-5); }
.dev-note { margin: 0 0 var(--space-4); font-size: var(--fs-body); color: var(--text-2); }
</style>
<script>
(function () {
  try {
    var th = localStorage.getItem("ov2.theme");
    var de = localStorage.getItem("ov2.density");
    if (th === "light" || th === "dark") document.documentElement.dataset.theme = th;
    if (de === "cozy" || de === "compact") document.documentElement.dataset.density = de;
  } catch (e) { /* private mode */ }
})();
</script>
</head>
<body>
<div id="dev-root">
  <div class="dev-head">
    <h1>component harness</h1>
    <code>design/v2/mockup/dev-components.html · not linked from the shell nav</code>
  </div>
</div>
<script type="module" src="js/dev-components.mjs"></script>
</body>
</html>
