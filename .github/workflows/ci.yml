name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt

      - name: Install dependencies (locked + hash-verified)
        run: |
          pip install --upgrade pip
          pip install --require-hashes -r requirements.lock

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Install Playwright Chromium (v2 GUI e2e)
        # Chromium only, headless — the v2 e2e suite (tests/test_v2_*_e2e.py)
        # never opens a headed browser or touches firefox/webkit. Without
        # this step the browser binary is missing: the package install above
        # already makes every v2 e2e test's
        # `pytest.importorskip("playwright.sync_api")` guard pass (the
        # *package* is present), so the tests would no longer skip — they
        # would instead fail with "Executable doesn't exist" from
        # `_v2_browser`'s `chromium.launch()` in tests/v2_e2e_utils.py. This
        # step is what makes them actually pass instead.
        run: python -m playwright install --with-deps chromium

      - name: Security audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.lock --strict
        continue-on-error: false

      - name: Lint naive datetime
        run: python3 scripts/check_no_naive_datetime.py

      - name: Doc link check
        run: python scripts/check_doc_links.py

      - name: i18n audit
        # Hard gate — promoted 2026-05-10 after the 3.26.0-i18n-architecture
        # refactor cleared all residue (audit reports 0 findings).
        run: python scripts/audit_i18n_usage.py

      - name: Type check (strict subset)
        # Hard gate — checks ONLY the 3 entry files Batch 5 M11 typed.
        # --follow-imports=silent uses imported modules for type inference
        # but suppresses their (still ~118) errors; promoting the rest to
        # hard would require typing the transitive surface (gui/_helpers,
        # html_exporter, cli/_render, …), tracked separately.
        run: mypy --follow-imports=silent src/api_client.py src/analyzer.py src/reporter.py

      - name: Run tests
        run: pytest --tb=short

  # 離線 bundle 的套件集合（requirements-offline.lock）必須在**它實際部署的
  # Python** 上稽核，所以獨立成一個 job 而不是掛在 test matrix 底下。
  # 鎖檔釘的是 py3.12 才裝得起來的版本（matplotlib==3.11.1 需要 >= 3.11），
  # 而 test matrix 跑 3.10/3.11；pip-audit 會把 requirements 裝進臨時 venv 驗證
  # （--no-deps 也擋不掉，實測 run 30155387549），在 3.10 上必然
  # "No matching distribution found" 而讓整個 job 失敗。
  offline-audit:
    name: Security audit (offline bundle lock)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        # 必須與 scripts/build_offline_bundle.sh 的 PBS_PYTHON 大版本一致——
        # bundle 帶的就是這個直譯器，稽核對象要跟出貨對象相同。
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Audit the offline lock
        # 沒有 --ignore-vuln：目標平台提升到 manylinux_2_28 之後，先前被
        # manylinux_2_17 卡住的套件（pillow / pandas / greenlet / contourpy /
        # argon2-cffi-bindings）都能升到已修補版本，這份鎖檔目前是零已知漏洞。
        # 任何新漏洞——不論哪個套件——都會直接擋下 CI，這正是我們要的。
        run: |
          pip install --upgrade pip
          pip install pip-audit
          pip-audit -r requirements-offline.lock --strict
        continue-on-error: false
