name: CI

on:
  push:
    branches: [main, "feat/v6-**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py3.12
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt

      - name: Install runtime dependencies (locked + hash-verified)
        run: |
          pip install --upgrade pip
          pip install --require-hashes -r requirements.lock

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Install Playwright browser
        # A clean runner has the playwright package but no browser binary. --with-deps also asks apt for the
        # system libraries; when the runner cannot reach the package mirror (2026-11-11: four runs in a row failed
        # here, "Temporary failure resolving 'azure.archive.ubuntu.com'", before any test ran) it is tried again,
        # then the browser alone is installed: the runner image already carries Chrome's libraries, and if one is
        # missing the browser tests say so.
        run: |
          for attempt in 1 2 3; do
            python -m playwright install --with-deps chromium && exit 0
            echo "attempt $attempt failed; waiting before the next"
            sleep 30
          done
          python -m playwright install chromium

      - name: Security audit (pip-audit)
        run: pip-audit -r requirements.lock --strict

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix web

      - name: Generated contracts and types are committed and current
        run: |
          bash scripts/gen_contracts.sh
          git diff --exit-code web/src/api/contracts.json web/src/api/generated.ts

      - name: Frontend typecheck
        run: npm --prefix web run typecheck

      - name: Frontend build
        run: npm --prefix web run build

      - name: Lint (ruff)
        run: ruff check illumio_ops tests scripts

      - name: Type check (mypy strict)
        run: mypy --config-file mypy.ini

      - name: Tests
        run: python -m pytest tests -n auto --dist loadfile
